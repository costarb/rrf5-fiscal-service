openapi: 3.1.0
info:
  title: RRF5 Fiscal Service — Foundation administrative API
  version: 0.2.0
  summary: Identity, issuer registration, vault, tax profiles and schema selection (feature 002). No document emission.
  description: |
    Administrative contract of the foundation (FF-013). Every `/v1` call needs a bearer
    token from `/oauth/token` (client credentials, ES256 JWT, 10 minutes) with the scope
    named in each operation. Resources of other tenants, and establishments not granted
    to the calling application, answer `404` exactly like missing ones.

    Every mutation requires an `Idempotency-Key`: the same key and canonical request
    replays the stored response (`Idempotent-Replayed: true`, secrets shown once are not
    repeated); the same key with another request is `409 idempotency.conflict`.

    Every error is Problem Details (RFC 9457) with a stable `code` (closed enum
    `ErrorCode`) and the `correlationId` echoed from `X-Correlation-Id`. The token
    endpoint answers RFC 6749 errors instead.
  license:
    name: Proprietary
    identifier: LicenseRef-RRF5-Proprietary
servers:
  - url: http://localhost:5179
    description: Local development (deploy/compose stack)
security:
  - clientCredentials: []
tags:
  - name: auth
    description: Token issuance and key publication (ADR-013).
  - name: tenancy
    description: Tenants, applications, secrets and establishment grants (F1).
  - name: issuer
    description: Companies, establishments, environments, configuration and series (F2).
  - name: vault
    description: A1 certificates and CSC, stored only in the vault (F3).
  - name: rules
    description: Tax profiles, rules and four-eyes versions (F4).
  - name: regulatory
    description: Schema selection and audited release of package-exclusive elements (F5).
  - name: documents
    description: NFC-e emission in homologation (feature 005). Operations marked x-rrf5-planned are specified but not implemented yet.
  - name: operations
    description: Liveness.

paths:
  /health/live:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Process liveness (never reports SEFAZ availability)
      security: []
      responses:
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "200":
          description: The process answers.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: live }

  /oauth/token:
    post:
      tags: [auth]
      operationId: issueToken
      summary: Issue an access token (client_credentials only)
      description: Client authentication by HTTP Basic or by `client_id`/`client_secret` in the form, never both. Rate limited per client address.
      security:
        - clientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { const: client_credentials }
                scope: { type: string, description: Space-separated subset of the application scopes. }
                client_id: { type: string }
                client_secret: { type: string, format: password }
      responses:
        "200":
          description: Token issued.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: Invalid request, unsupported grant or invalid scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Unknown client, wrong secret, or suspended application or tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Public token verification keys
      security: []
      responses:
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "200":
          description: JWK set (EC P-256, ES256).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/me:
    get:
      tags: [tenancy]
      operationId: getCaller
      summary: The calling application, its tenant, scopes and granted establishments
      responses:
        "200":
          description: Caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caller" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tenants:
    post:
      tags: [tenancy]
      operationId: createTenant
      summary: Create a tenant (scope platform.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenant" }
      responses:
        "201": { $ref: "#/components/responses/Tenant" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tenants/{tenantId}:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [tenancy]
      operationId: getTenant
      summary: Read a tenant (scope platform.admin)
      responses:
        "200": { $ref: "#/components/responses/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tenants/{tenantId}/suspend:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [tenancy]
      operationId: suspendTenant
      summary: Suspend a tenant; its applications get no new token (scope platform.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tenants/{tenantId}/applications:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [tenancy]
      operationId: createTenantApplication
      summary: Create an application in a tenant, typically its first tenant.admin (scope platform.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplication" }
      responses:
        "201": { $ref: "#/components/responses/ApplicationWithSecret" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications:
    post:
      tags: [tenancy]
      operationId: createApplication
      summary: Create an application in the caller tenant (scope tenant.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplication" }
      responses:
        "201": { $ref: "#/components/responses/ApplicationWithSecret" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications/{applicationId}:
    parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
    get:
      tags: [tenancy]
      operationId: getApplication
      summary: Read an application of the caller tenant (scope tenant.admin)
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications/{applicationId}/rotate-secret:
    parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
    post:
      tags: [tenancy]
      operationId: rotateApplicationSecret
      summary: Replace the secret; the old one stops issuing tokens (scope tenant.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/ApplicationWithSecret" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications/{applicationId}/suspend:
    parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
    post:
      tags: [tenancy]
      operationId: suspendApplication
      summary: Suspend an application (scope tenant.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications/{applicationId}/establishments:
    parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
    get:
      tags: [tenancy]
      operationId: listApplicationGrants
      summary: Establishments granted to the application (own grants without tenant.admin)
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema:
                type: object
                required: [establishmentIds]
                properties:
                  establishmentIds: { type: array, items: { type: string, format: uuid } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/applications/{applicationId}/establishments/{establishmentId}:
    parameters:
      - { $ref: "#/components/parameters/ApplicationId" }
      - { $ref: "#/components/parameters/EstablishmentId" }
    put:
      tags: [tenancy]
      operationId: grantEstablishment
      summary: Grant an establishment of the tenant to the application (scope tenant.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Granted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [tenancy]
      operationId: revokeEstablishment
      summary: Revoke an establishment grant (scope tenant.admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/companies:
    post:
      tags: [issuer]
      operationId: createCompany
      summary: Register a company by canonical CNPJ (scope issuer.write)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCompany" }
      responses:
        "201": { $ref: "#/components/responses/Company" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/companies/{companyId}:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [issuer]
      operationId: getCompany
      summary: Read a company (scope issuer.read or issuer.write)
      responses:
        "200": { $ref: "#/components/responses/Company" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/companies/{companyId}/establishments:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    post:
      tags: [issuer]
      operationId: createEstablishment
      summary: Register an establishment of the company; granted to the caller (scope issuer.write)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEstablishment" }
      responses:
        "201": { $ref: "#/components/responses/Establishment" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/establishments/{establishmentId}:
    parameters: [{ $ref: "#/components/parameters/EstablishmentId" }]
    get:
      tags: [issuer]
      operationId: getEstablishment
      summary: Read a granted establishment (scope issuer.read or issuer.write)
      responses:
        "200": { $ref: "#/components/responses/Establishment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/establishments/{establishmentId}/environments:
    parameters: [{ $ref: "#/components/parameters/EstablishmentId" }]
    get:
      tags: [issuer]
      operationId: listEnvironments
      summary: Environments of a granted establishment (scope issuer.read or issuer.write)
      responses:
        "200":
          description: Environments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Environment" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [issuer]
      operationId: createEnvironment
      summary: Create the HOMOLOGATION or PRODUCTION environment (one of each; scope issuer.write)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environment]
              properties:
                environment: { $ref: "#/components/schemas/EnvironmentKind" }
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/establishments/{establishmentId}/tax-resolution:
    parameters: [{ $ref: "#/components/parameters/EstablishmentId" }]
    get:
      tags: [rules]
      operationId: resolveTaxRule
      summary: The approved rule version in force for the establishment UF, dimensions and date (scope fiscal.rules.read)
      parameters:
        - { name: profileId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: model, in: query, required: true, schema: { $ref: "#/components/schemas/Model" } }
        - { name: operation, in: query, required: true, schema: { type: string } }
        - { name: itemClass, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: false, description: Sao Paulo civil date; today when omitted., schema: { type: string, format: date } }
      responses:
        "200":
          description: Resolved rule and version.
          content:
            application/json:
              schema:
                type: object
                required: [rule, version]
                properties:
                  rule: { $ref: "#/components/schemas/TaxRule" }
                  version: { $ref: "#/components/schemas/TaxRuleVersion" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/environments/{environmentId}/configuration:
    parameters: [{ $ref: "#/components/parameters/EnvironmentId" }]
    get:
      tags: [issuer]
      operationId: getConfiguration
      summary: Active configuration version (scope issuer.read or issuer.write)
      responses:
        "200": { $ref: "#/components/responses/Configuration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [issuer]
      operationId: replaceConfiguration
      summary: Create the next configuration version (scope issuer.write)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationInput" }
      responses:
        "200": { $ref: "#/components/responses/Configuration" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/environments/{environmentId}/series:
    parameters: [{ $ref: "#/components/parameters/EnvironmentId" }]
    get:
      tags: [issuer]
      operationId: listSeries
      summary: Series of the environment (scope issuer.read or issuer.write)
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [issuer]
      operationId: createSeries
      summary: Create a cloud-allocated series (scope issuer.write); numbers are reserved only by emission
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesInput" }
      responses:
        "201": { $ref: "#/components/responses/Series" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/series/{seriesId}:
    parameters: [{ $ref: "#/components/parameters/SeriesId" }]
    get:
      tags: [issuer]
      operationId: getSeries
      summary: Read a series (scope issuer.read or issuer.write)
      responses:
        "200": { $ref: "#/components/responses/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/series/{seriesId}/suspend:
    parameters: [{ $ref: "#/components/parameters/SeriesId" }]
    post:
      tags: [issuer]
      operationId: suspendSeries
      summary: Suspend a series (scope issuer.write)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/Series" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/environments/{environmentId}/certificates:
    parameters: [{ $ref: "#/components/parameters/EnvironmentId" }]
    get:
      tags: [vault]
      operationId: listCertificates
      summary: Certificate metadata of the environment, never bytes or password (scope certificates.manage or issuer.read)
      responses:
        "200":
          description: Certificates, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [vault]
      operationId: uploadCertificate
      summary: Upload an A1 as PENDING_APPROVAL; checked before storage and sealed in the vault (scope certificates.manage)
      description: The PKCS#12 must open with the password, hold one RSA key, be inside its validity, chain to an ICP-Brasil root (current ITI bundle) with no revoked certificate, and its holder CNPJ-Base (ICP-Brasil OID 2.16.76.1.3.3) must equal the establishment CNPJ-Base (MOC rule F03, rejection 213). Another application with certificates.approve activates it.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCertificate" }
      responses:
        "201":
          description: Certificate stored; metadata only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/certificates/{certificateId}/approve:
