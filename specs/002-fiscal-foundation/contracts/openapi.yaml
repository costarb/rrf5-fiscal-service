      operationId: getDocument
      summary: Current state of a document; poll while it is not terminal (scope documents.read)
      responses:
        "200":
          description: The document. While the state is not terminal, Retry-After says when to poll again.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 }, description: Present only for non-terminal states. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalDocument" }
              examples:
                waiting:
                  summary: Polling a document whose result is still unknown
                  value:
                    id: 7d1f8f6e-0f0a-4f2b-9a9e-2a3e3c1d5b10
                    externalId: pedido-1001
                    state: WAITING_SEFAZ
                    terminal: false
                    series: 1
                    number: 42
                    total: "25.90"
                authorized:
                  summary: Terminal state after authorization
                  value:
                    id: 7d1f8f6e-0f0a-4f2b-9a9e-2a3e3c1d5b10
                    externalId: pedido-1001
                    state: AUTHORIZED
                    terminal: true
                    series: 1
                    number: 42
                    total: "25.90"
                    authorization: { cStat: 100, xMotivo: Autorizado o uso da NF-e, protocol: "135260000000001", authorizedAt: "2026-11-20T12:00:01-03:00" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

