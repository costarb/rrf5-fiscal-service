name: Foundation CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Rrf5.Fiscal.slnx
      - name: Build (warnings are errors)
        run: dotnet build Rrf5.Fiscal.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Rrf5.Fiscal.slnx -c Release --no-build

  image:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: Api, image: rrf5-fiscal-api }
          - { app: Worker, image: rrf5-fiscal-worker }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/docker/Dockerfile --build-arg APP=${{ matrix.app }} -t ${{ matrix.image }}:ci .
      - name: Runs as non-root
        run: test "$(docker image inspect ${{ matrix.image }}:ci --format '{{.Config.User}}')" = "1654"
      - name: CycloneDX SBOM
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" "$TRIVY_IMAGE" \
            image --quiet --format cyclonedx --output /out/${{ matrix.app }}.cdx.json ${{ matrix.image }}:ci
      - name: Vulnerability scan (fails on fixable high/critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${{ matrix.image }}:ci
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom/${{ matrix.app }}.cdx.json
