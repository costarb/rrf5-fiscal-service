        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/documents/{documentId}/danfe:
    parameters: [{ $ref: "#/components/parameters/DocumentId" }]
    get:
      tags: [documents]
      operationId: getDanfe
      x-rrf5-planned: true
      summary: DANFE NFC-e ready to print, built from the nfeProc (scope documents.read)
      description: The integrating ERP prints it (operator decision, 2026-11-12). Manual DANFE NFC-e v6.0.
      parameters:
        - name: paper
          in: query
          required: false
          schema: { type: string, enum: ["80mm", "58mm"], default: "80mm" }
      responses:
        "200":
          description: Print-ready HTML.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents/{documentId}/print-data:
    parameters: [{ $ref: "#/components/parameters/DocumentId" }]
    get:
      tags: [documents]
      operationId: getPrintData
      x-rrf5-planned: true
      summary: Data an ERP needs to print its own DANFE layout (scope documents.read)
      responses:
        "200":
          description: QR Code content and URLs of an AUTHORIZED document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: Machine-to-machine only (ADR-013). Tokens are ES256 JWTs signed by the vault, valid for 10 minutes.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            platform.admin: Create and suspend tenants; bootstrap tenant applications (platform tenant only).
            tenant.admin: Manage the caller tenant applications, secrets and establishment grants.
            issuer.read: Read issuer registration.
            issuer.write: Register companies, establishments, environments, configuration, series and schema releases.
            certificates.manage: Upload A1 certificates and store the CSC (never together with certificates.approve).
            certificates.approve: Activate or reject uploaded certificates (never together with certificates.manage).
            fiscal.rules.read: Read and resolve tax rules.
            fiscal.rules.write: Author tax profiles, rules and versions (never together with approve).
            fiscal.rules.approve: Approve, reject, close and retire rule versions (never together with write).
    clientBasic:
      type: http
      scheme: basic
      description: client_secret_basic for /oauth/token.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 255 visible ASCII characters, unique per operation and caller tenant.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[!-~]+$" }
    TenantId: { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    CompanyId: { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    EstablishmentId: { name: establishmentId, in: path, required: true, schema: { type: string, format: uuid } }
    EnvironmentId: { name: environmentId, in: path, required: true, schema: { type: string, format: uuid } }
    SeriesId: { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
    CertificateId: { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }

  headers:
    CorrelationId:
      description: Echo of a safe X-Correlation-Id, or a generated one.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }

  responses:
    Tenant:
      description: Tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Tenant" }
    Application:
      description: Application (never its secret).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Application" }
    ApplicationWithSecret:
      description: Application with clientSecret on the first response only; replays omit it.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplicationWithSecret" }
    Company:
      description: Company.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Company" }
    Establishment:
      description: Establishment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Establishment" }
    Configuration:
      description: Configuration version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Configuration" }
    Series:
      description: Series.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Series" }
    TaxProfile:
      description: Tax profile.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaxProfile" }
    TaxRuleVersion:
      description: Tax rule version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaxRuleVersion" }
    InvalidRequest:
      description: Invalid request (request.invalid, request.idempotency_key_invalid).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: Missing, expired or invalid token (auth.unauthenticated).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Missing scope or forbidden action (auth.scope_missing, auth.forbidden, rules.four_eyes).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Missing, of another tenant, or not granted (resource.not_found, rules.not_in_force, schema.not_resolved).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict (resource.conflict, idempotency.conflict, state.immutable, state.invalid_transition, series.exhausted, rules.validity_overlap).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Consistency or support failure (validation.constraint, certificate.*, rules.*, artifact.refused).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MethodNotAllowed:
      description: Method not allowed on this path (request.method_not_allowed).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests (rate_limited).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DocumentAccepted:
      description: Accepted and not terminal yet; poll the Location until the state is terminal.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
        Location: { required: true, schema: { type: string }, description: Path of the document resource. }
        Retry-After: { required: true, schema: { type: integer, minimum: 1 }, description: Seconds before the next poll. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FiscalDocument" }
    Unavailable:
      description: A dependency (database, vault, object storage) is unavailable; the operation failed closed (dependency.unavailable).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ErrorCode:
      description: Closed catalog of stable error codes (src/Rrf5.Fiscal.Application/Errors/ErrorCode.cs).
      type: string
      enum:
        - request.invalid
        - request.idempotency_key_invalid
        - auth.unauthenticated
        - auth.forbidden
        - auth.scope_missing
        - rules.four_eyes
        - resource.not_found
        - request.method_not_allowed
        - resource.conflict
        - idempotency.conflict
        - state.immutable
        - state.invalid_transition
        - series.exhausted
        - certificate.invalid
        - certificate.outside_validity
        - certificate.holder_mismatch
        - certificate.untrusted
        - certificate.revoked
        - certificate.revocation_unavailable
        - certificate.not_active
        - series.not_available
        - payment.method_not_configured
        - payment.method_not_in_force
        - payment.card_invalid
        - document.totals_mismatch
        - document.consumer_invalid
        - document.product_invalid
        - document.tax_mismatch
        - document.invalid
        - rules.unsupported_group
        - rules.payload_invalid
        - rules.not_in_force
        - rules.crt_mismatch
        - rules.validity_overlap
        - schema.not_resolved
        - artifact.refused
        - artifact.integrity_failed
        - validation.constraint
        - rate_limited
        - dependency.unavailable
        - internal.error
    DocumentState:
      description: Closed state set of a fiscal document (data-model.md, L10), enforced by the database (migration 0011). WAITING_SEFAZ also covers a result still unknown; it is reconciled by consultation before any resend.
      type: string
      enum:
        - DRAFT
        - VALIDATING
        - READY_TO_SIGN
        - SIGNING
        - SIGNED
        - QUEUED
        - SENDING
        - WAITING_SEFAZ
        - AUTHORIZED
        - REJECTED
        - ERROR
        - CANCELLATION_REQUESTED
        - CANCELLED
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, description: "urn:rrf5:problem:<code>" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Fixed sentence; never echoes request values or secrets. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        correlationId: { type: string }
        traceId: { type: string }
        problems:
          type: array
          description: "With document.invalid: every pre-validation problem, with its JSON pointer into the request."
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
              pointer: { type: [string, "null"] }
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_scope, unsupported_grant_type] }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer, const: 600 }
        scope: { type: string }
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, kid, x, y]
            properties:
              kty: { const: EC }
              crv: { const: P-256 }
              use: { const: sig }
              alg: { const: ES256 }
              kid: { type: string }
              x: { type: string }
              y: { type: string }
    Scope:
      type: string
      enum: [platform.admin, tenant.admin, issuer.read, issuer.write, certificates.manage, certificates.approve, fiscal.rules.read, fiscal.rules.write, fiscal.rules.approve, documents.issue, documents.read]
    Caller:
      type: object
      required: [tenantId, applicationId, scopes, establishmentIds]
      properties:
        tenantId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        establishmentIds: { type: array, items: { type: string, format: uuid } }
    CreateTenant:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    Tenant:
      type: object
      required: [id, name, status, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        kind: { type: string, enum: [PLATFORM, CUSTOMER] }
        createdAt: { type: string, format: date-time }
    CreateApplication:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Scope" } }
    Application:
      type: object
      required: [id, tenantId, clientId, name, scopes, status, secretRotatedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        clientId: { type: string, pattern: "^app_[a-f0-9]{32}$" }
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        secretRotatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApplicationWithSecret:
      allOf:
        - { $ref: "#/components/schemas/Application" }
        - type: object
          properties:
            clientSecret: { type: string, description: "Shown once; prefixed rrf5s_. Absent on replays.", writeOnly: false }
    Cnpj:
      type: string
      description: Canonical or formatted CNPJ, alphanumeric allowed; check digits per NT Conjunta 2025.001.
      maxLength: 32
    CreateCompany:
      type: object
      additionalProperties: false
      required: [legalName, taxId]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        taxId: { $ref: "#/components/schemas/Cnpj" }
    Company:
      type: object
      required: [id, legalName, taxId, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        taxId: { type: string, pattern: "^[0-9A-Z]{12}[0-9]{2}$" }
        createdAt: { type: string, format: date-time }
    Address:
      type: object
      additionalProperties: false
      required: [street, number, district, municipalityName, postalCode]
      properties:
        street: { type: string, maxLength: 60 }
        number: { type: string, maxLength: 60 }
        complement: { type: [string, "null"], maxLength: 60 }
        district: { type: string, maxLength: 60 }
        municipalityName: { type: string, maxLength: 60 }
        postalCode: { type: string, description: 8 digits; punctuation ignored. }
        phone: { type: [string, "null"] }
    CreateEstablishment:
      type: object
      additionalProperties: false
      required: [taxId, uf, municipalityCode, crt, address]
      properties:
        taxId: { $ref: "#/components/schemas/Cnpj" }
        stateRegistration: { type: [string, "null"], description: "2 to 14 letters/digits or ISENTO; per-UF check digits are not validated." }
        uf: { type: string, pattern: "^[A-Z]{2}$" }
        municipalityCode: { type: string, pattern: "^[0-9]{7}$", description: IBGE code within the UF. }
        cnae: { type: [string, "null"] }
        crt: { type: integer, enum: [1, 2, 3, 4], description: Layout CRT enumeration. }
        address: { $ref: "#/components/schemas/Address" }
    Establishment:
      type: object
      required: [id, companyId, taxId, uf, municipalityCode, crt, address, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        taxId: { type: string }
        stateRegistration: { type: [string, "null"] }
        uf: { type: string }
        municipalityCode: { type: string }
        cnae: { type: [string, "null"] }
        crt: { type: integer }
        address: { $ref: "#/components/schemas/Address" }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
    EnvironmentKind:
      type: string
      enum: [HOMOLOGATION, PRODUCTION]
    Environment:
      type: object
      required: [id, establishmentId, environment, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        environment: { $ref: "#/components/schemas/EnvironmentKind" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
    ConfigurationInput:
      type: object
      additionalProperties: false
      required: [timezone, catalogVersion]
      properties:
        timezone: { type: string, description: "IANA id, for example America/Sao_Paulo." }
        authorizer: { type: [string, "null"], description: Must equal the catalogued authorizer of the establishment UF (today SP). }
        catalogVersion: { type: string }
    Configuration:
      type: object
      required: [id, environmentId, version, timezone, authorizer, catalogVersion, cscConfigured, schemaPolicy, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        timezone: { type: string }
        authorizer: { type: string }
        catalogVersion: { type: string }
        cscConfigured: { type: boolean, description: The CSC itself is never returned. }
        schemaPolicy: { type: object, description: Audited releases of package-exclusive elements. }
        status: { type: string, enum: [ACTIVE, SUPERSEDED] }
        createdAt: { type: string, format: date-time }
    Model:
      type: string
      enum: ["55", "65"]
    SeriesInput:
      type: object
      additionalProperties: false
      required: [model, series]
      properties:
        model: { $ref: "#/components/schemas/Model" }
        series: { type: integer, minimum: 0, maximum: 999 }
        numberMin: { type: [integer, "null"], minimum: 1 }
        numberMax: { type: [integer, "null"], maximum: 999999999 }
        nextNumber: { type: [integer, "null"], minimum: 1 }
    Series:
      type: object
      required: [id, environmentId, model, series, numberMin, numberMax, nextNumber, allocationOwner, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        model: { $ref: "#/components/schemas/Model" }
        series: { type: integer }
        numberMin: { type: integer }
        numberMax: { type: integer }
        nextNumber: { type: integer, description: Never decreases; numberMax + 1 means exhausted. }
        allocationOwner: { type: string, enum: [CLOUD, LOCAL_AGENT] }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
    UploadCertificate:
      type: object
      additionalProperties: false
      required: [pkcs12, password]
      properties:
        pkcs12: { type: string, contentEncoding: base64, description: PKCS#12 up to 64 KiB. }
        password: { type: string, format: password, writeOnly: true }
    Certificate:
      type: object
      required: [id, environmentId, fingerprintSha256, subjectTaxId, notBefore, notAfter, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        fingerprintSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        subjectTaxId: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        status: { type: string, enum: [PENDING_APPROVAL, ACTIVE, SUPERSEDED, REVOKED, REJECTED] }
        chainRoot: { type: [string, "null"], description: Name of the ICP-Brasil root the chain ends at. }
        uploadedBy: { type: [string, "null"], format: uuid }
        approverApplicationId: { type: [string, "null"], format: uuid }
        approvedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ReplaceCsc:
      type: object
      additionalProperties: false
      required: [cscId, csc]
      properties:
        cscId: { type: string, pattern: "^[0-9]{1,6}$" }
        csc: { type: string, format: password, writeOnly: true, maxLength: 36 }
    SchemaSelection:
      type: object
      required: [catalogReferenceId, package, packageVersion, artifactSha256, artifactStored, authorizer, environment, date, exclusiveElementsEnabled, exclusiveElementsDisabled]
      properties:
        catalogReferenceId: { type: string }
        package: { type: string, pattern: "^[0-9]{3}[a-z]$" }
        packageVersion: { type: string }
        artifactSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        artifactStored: { type: boolean }
        authorizer: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKind" }
        date: { type: string, format: date }
        exclusiveElementsEnabled: { type: array, items: { type: string } }
        exclusiveElementsDisabled: { type: array, items: { type: string } }
    SchemaRelease:
      type: object
      additionalProperties: false
      required: [package, elements, evidence]
      properties:
        package: { type: string, pattern: "^[0-9]{3}[a-z]$" }
        elements: { type: array, minItems: 1, items: { type: string } }
        evidence: { type: string, minLength: 10, maxLength: 500 }
    CreateTaxProfile:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
    TaxProfile:
      type: object
      required: [id, code, name, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
    CreateTaxRule:
      type: object
      additionalProperties: false
      required: [model, uf, operation, itemClass]
      properties:
        model: { $ref: "#/components/schemas/Model" }
        uf: { type: string, pattern: "^[A-Z]{2}$" }
        operation: { type: string, pattern: "^[A-Z0-9][A-Z0-9_]{1,63}$" }
        itemClass: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
    TaxRule:
      type: object
      required: [id, profileId, model, uf, operation, itemClass, createdAt]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        model: { $ref: "#/components/schemas/Model" }
        uf: { type: string }
        operation: { type: string }
        itemClass: { type: string }
        createdAt: { type: string, format: date-time }
    SourceReference:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties:
        kind: { type: string, maxLength: 64 }
        reference: { type: string, maxLength: 500 }
        date: { type: [string, "null"] }
    VersionInput:
      type: object
      additionalProperties: false
      required: [payload, validFrom, sourceRefs]
      properties:
        payload: { type: object, description: "Rule payload; JSON Schema at /v1/tax-rule-payload.schema.json." }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        sourceRefs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/SourceReference" } }
    TaxRuleVersionStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, RETIRED]
    TaxRuleVersion:
      type: object
      required: [id, ruleId, versionNumber, status, payload, generatorVersion, validFrom, sourceRefs, authorApplicationId]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/TaxRuleVersionStatus" }
        payload: { type: object }
        generatorVersion: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        sourceRefs: { type: array, items: { $ref: "#/components/schemas/SourceReference" } }
        authorApplicationId: { type: string, format: uuid }
        approverApplicationId: { type: [string, "null"], format: uuid }
        submittedAt: { type: [string, "null"], format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
    Money:
      type: string
      description: Decimal with two places and a dot separator (MOC Anexo I, footnote (*4)).
      pattern: "^[0-9]{1,13}\\.[0-9]{2}$"
    CreateDocument:
      type: object
      additionalProperties: false
      required: [externalId, nature, operation, items, payments]
      properties:
        nature: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$", description: "Code of the operation nature (tax profile) whose approved rules must cover every item (ADR-017)." }
        operation: { type: string, minLength: 1, maxLength: 60, description: "Business operation code of the approved tax rules, e.g. VENDA (ADR-015)." }
        externalId: { type: string, minLength: 1, maxLength: 100, description: The client's sale id; unique per environment. }
        seriesId: { type: string, format: uuid, description: Optional; defaults to the environment's only active NFC-e series. }
        consumer:
          type: object
          additionalProperties: false
          properties:
            cpf: { type: string, pattern: "^[0-9]{11}$" }
            name: { type: string, minLength: 2, maxLength: 60 }
        items:
          type: array
          minItems: 1
          maxItems: 990
          items: { $ref: "#/components/schemas/DocumentItem" }
        payments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/DocumentPayment" }
        change: { $ref: "#/components/schemas/Money" }
    DocumentItem:
      type: object
      additionalProperties: false
      description: "Product attributes come from the ERP registry (ADR-017). CFOP and CSOSN must equal the approved rule of the nature that covers the item (class ncm-<NCM>, else ANY); otherwise the item is refused with document.tax_mismatch. The service never infers or completes them."
      required: [productCode, description, unit, gtin, ncm, origin, cfop, csosn, quantity, unitPrice]
      properties:
        productCode: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, minLength: 1, maxLength: 120 }
        unit: { type: string, minLength: 1, maxLength: 6, description: "uCom (layout TString, 1 to 6)." }
        gtin: { type: string, pattern: "^(SEM GTIN|[0-9]{8}|[0-9]{12,14})$", description: "cEAN: SEM GTIN or a GTIN with a valid GS1 check digit." }
        ncm: { type: string, pattern: "^([0-9]{2}|[0-9]{8})$", description: "NCM as registered in the ERP (layout pattern)." }
        cest: { type: string, pattern: "^[0-9]{7}$", description: Optional CEST (layout pattern). }
        origin: { type: string, pattern: "^[0-8]$", description: "orig (Torig 0 to 8)." }
        cfop: { type: string, pattern: "^[123567][0-9]{3}$" }
        csosn: { type: string, pattern: "^[0-9]{3}$" }
        quantity: { type: string, pattern: "^[0-9]{1,11}(\\.[0-9]{1,4})?$" }
        unitPrice: { type: string, pattern: "^[0-9]{1,11}(\\.[0-9]{1,10})?$" }
        discount: { $ref: "#/components/schemas/Money" }
        surcharge: { $ref: "#/components/schemas/Money" }
    DocumentPayment:
      type: object
      additionalProperties: false
      required: [method, amount]
      properties:
        method: { type: string, enum: [CASH, PIX, CREDIT_CARD, DEBIT_CARD, VOUCHER, STORE_CREDIT, OTHER], description: "Commercial method, mapped to the official tPag by configuration." }
        amount: { $ref: "#/components/schemas/Money" }
        description: { type: string, minLength: 2, maxLength: 60 }
        card:
          type: object
          additionalProperties: false
          required: [integration]
          properties:
            integration: { type: integer, enum: [1, 2], description: "tpIntegra: 1 integrated, 2 not integrated." }
            acquirerCnpj: { $ref: "#/components/schemas/Cnpj" }
            brand: { type: string, pattern: "^[0-9]{2}$" }
            authorizationCode: { type: string, minLength: 1, maxLength: 128 }
    PrevalidationResult:
      type: object
      required: [valid, problems]
      properties:
        valid: { type: boolean }
        totals:
          type: [object, "null"]
          description: "Computed totals: vProd, vDesc, vOutro, vNF (rule W16), payments and change."
          properties:
            products: { $ref: "#/components/schemas/Money" }
            discounts: { $ref: "#/components/schemas/Money" }
            surcharges: { $ref: "#/components/schemas/Money" }
            total: { $ref: "#/components/schemas/Money" }
            payments: { $ref: "#/components/schemas/Money" }
            change: { $ref: "#/components/schemas/Money" }
        problems:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code: { $ref: "#/components/schemas/ErrorCode" }
              detail: { type: string }
              pointer: { type: string, description: JSON pointer into the request. }
    FiscalDocument:
      type: object
      required: [id, externalId, state, terminal]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        state: { $ref: "#/components/schemas/DocumentState" }
        terminal: { type: boolean, description: "True for AUTHORIZED, REJECTED and CANCELLED." }
        emissionMode: { type: string, enum: [SYNC, ASYNC] }
        series: { type: [integer, "null"] }
        number: { type: [integer, "null"] }
        accessKey: { type: [string, "null"], pattern: "^[0-9]{6}[0-9A-Z]{12}[0-9]{26}$" }
        total: { $ref: "#/components/schemas/Money" }
        authorization:
          type: [object, "null"]
          properties:
            cStat: { type: integer }
            xMotivo: { type: string }
            protocol: { type: string }
            authorizedAt: { type: string, format: date-time }
        rejection:
          type: [object, "null"]
          description: Official SEFAZ answer, kept apart from technical failures (FR-021).
          properties:
            cStat: { type: integer }
            xMotivo: { type: string }
    PrintData:
      type: object
      required: [qrCode, qrCodeUrl, consultationUrl, accessKey]
      properties:
        qrCode: { type: string, description: Content of infNFeSupl/qrCode as authorized (QR v3 online). }
        qrCodeUrl: { type: string, format: uri }
        consultationUrl: { type: string, format: uri }
        accessKey: { type: string, pattern: "^[0-9]{6}[0-9A-Z]{12}[0-9]{26}$" }
    PaymentMethods:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: object
          description: Commercial method to official tPag code.
          propertyNames: { enum: [CASH, PIX, CREDIT_CARD, DEBIT_CARD, VOUCHER, STORE_CREDIT, OTHER] }
          additionalProperties: { type: string, pattern: "^[0-9]{2}$" }
          minProperties: 1
